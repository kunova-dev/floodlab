[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "floodlab"
version = "0.1.0"
description = "Auditable Earth observation flood investigation foundation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "shapely>=2,<3", "pystac-client>=0.8,<1", "streamlit>=1.40,<2", "folium>=0.18,<1", "streamlit-folium>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

