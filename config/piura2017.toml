[catalogue]
endpoint = "https://stac.dataspace.copernicus.eu/v1"
collection = "sentinel-1-grd"
max_items = 100

[paths]
cache = "data/cache"
uploads = "data/user_uploads"
outputs = "outputs"

[demo]
aoi = "config/aoi/piura2017.geojson"
start = "2017-03-01"
end = "2017-04-30"

[flood]
water_db = -17.0
drop_db = -3.0
min_pixels = 4

[history]
gap_days = 12
anomaly_multiplier = 3.0
minimum_excess = 0.02

[logging]
level = "INFO"

[openeo]
endpoint = "https://openeo.dataspace.copernicus.eu"
collection = "SENTINEL1_GRD"
coefficient = "sigma0-ellipsoid"
elevation_model = "COPERNICUS_30"
bands = ["VV"]
resolution_m = 20
resampling = "bilinear"
cache = "data/cache/openeo"
minimum_coverage = 0.80
minimum_valid_fraction = 0.80
poll_seconds = 20
max_wait_seconds = 7200

# Resource settings used by the successfully processed Piura pair.
[openeo.job_options]
python-memory = "8G"
executor-memory = "2G"
executor-memoryOverhead = "2G"
executor-cores = 1
task-cpus = 1
max-executors = 2

[pair_demo]
earlier = "2017-03-11"
later = "2017-04-04"
timing_evidence = "Not incorporated; baseline/event interpretation requires independent validation."
